name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "lychee.toml"
      - ".github/workflows/broken-links.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "lychee.toml"
      - ".github/workflows/broken-links.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Jekyll permalinks like /publications/ are not real folders in source.
      # Symlink them so --root-dir can resolve root-relative links locally.
      - name: Map Jekyll permalinks 🗺️
        run: |
          ln -sfn _pages/publications.md publications
          ln -sfn _pages/projects.md projects
          ln -sfn _pages/news.md news
          ln -sfn _pages/quickads.md quickads
          # note: do not create `cv` — conflicts with CV/ on case-insensitive FS; /cv/ page only links to /assets/

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}
            --verbose
            --no-progress
            './**/*.md'
            './**/*.html'
